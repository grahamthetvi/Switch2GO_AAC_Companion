; Version numbers are starting points from the build guide (Section 13.2).
; Compile check used espressif32 6.13.0 / Arduino-ESP32 2.0.17, FastLED 3.10.7,
; NimBLE-Arduino 1.4.3, ESP32-BLE-Keyboard 0.3.2 (git tag 0.3.2-beta).
; Pin NimBLE to 1.x: BleKeyboard uses the 1.x API. Arduino-ESP32 3.x (espressif32 7+)
; may break BleKeyboard — stay on platform 6.x.
[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    fastled/FastLED@^3.6.0
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/T-vK/ESP32-BLE-Keyboard.git#0.3.2-beta
build_flags =
    -D USE_NIMBLE

[env:scanner]
build_src_filter = +<main.cpp>

[env:stage3_led]
build_src_filter = +<stages/stage3_led.cpp>

[env:stage4_switch]
build_src_filter = +<stages/stage4_switch.cpp>

[env:stage5_pause]
build_src_filter = +<stages/stage5_pause.cpp>

[env:stage6_relay]
build_src_filter = +<stages/stage6_relay.cpp>

[env:stage7_keyboard]
build_src_filter = +<stages/stage7_keyboard.cpp>
